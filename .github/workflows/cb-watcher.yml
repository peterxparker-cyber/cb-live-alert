name: Chaturbate Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-slim

    steps:
      - name: Diagnose Chaturbate endpoint
        run: |
          set -u

          USERNAME="maia_stark_"
          API="https://chaturbate.com/api/biocontext/${USERNAME}/"

          echo "Testing:"
          echo "$API"
          echo

          echo "===== HTTP STATUS + HEADERS ====="

          HTTP_CODE=$(curl -sS \
            -o /tmp/response.txt \
            -D /tmp/headers.txt \
            -w "%{http_code}" \
            --connect-timeout 10 \
            --max-time 30 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/154.0.0.0 Safari/537.36" \
            "$API" || true)

          echo "HTTP status: $HTTP_CODE"
          echo

          echo "===== RESPONSE HEADERS ====="
          cat /tmp/headers.txt
          echo

          echo "===== RESPONSE BODY (first 1000 chars) ====="
          head -c 1000 /tmp/response.txt
          echo
