name: Chaturbate Live Watcher

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check Maia Stark
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          set -uo pipefail

          USERNAME="maia_stark_"
          API="https://chaturbate.com/api/biocontext/${USERNAME}/"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

          HTTP_CODE=$(curl -sSL \
            --retry 3 \
            --connect-timeout 10 \
            --max-time 30 \
            -o resp.json \
            -w "%{http_code}" \
            -A "$UA" \
            -H "Accept: application/json, text/plain, */*" \
            -H "Accept-Language: en-US,en;q=0.9" \
            -H "Referer: https://chaturbate.com/${USERNAME}/" \
            "$API" || echo "000")

          echo "Model: $USERNAME"
          echo "HTTP: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Blocked or error (HTTP $HTTP_CODE), skipping this run"
            head -c 300 resp.json 2>/dev/null || true
            exit 0
          fi

          STATUS=$(jq -r '.room_status // "unknown"' resp.json 2>/dev/null || echo "unknown")
          echo "Status: $STATUS"

          if [ "$STATUS" = "public" ]; then
            curl -fsS \
              -H "Title: 🔴 Maia Stark is LIVE" \
              -H "Priority: high" \
              -H "Tags: red_circle" \
              -d "Maia Stark is live now!" \
              "https://ntfy.sh/${NTFY_TOPIC}"
          fi
